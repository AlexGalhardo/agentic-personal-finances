name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Railway deploys only after every check here is green (docs/deploy/ci-cd.md):
# cross-platform packaging lives in release.yml so a macOS/Windows runner
# hiccup never blocks a deploy.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Dependency Rule (packages/core)
        run: bun run check:deps && bun run test:scripts
      - name: Typecheck scripts (dev.ts, qa.ts)
        run: bun run --cwd backend db:generate && bun run typecheck:scripts
        env:
          DATABASE_URL: file:./ci.db

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        working-directory: backend
        run: bun run db:generate
        env:
          DATABASE_URL: file:./ci.db
      - name: Typecheck
        working-directory: backend
        run: bun check --no-script
      - name: Test
        working-directory: backend
        run: bun run test:setup && bun test
      - name: Build (binary)
        working-directory: backend
        run: bun run build
        env:
          DATABASE_URL: file:./ci.db

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        working-directory: backend
        run: bun run db:generate
        env:
          DATABASE_URL: file:./ci.db
      - name: Typecheck
        working-directory: bot
        run: bun check --no-script
      - name: Test
        working-directory: bot
        run: bun run test:unit
      - name: Build (binary)
        working-directory: bot
        run: bun run build

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        working-directory: backend
        run: bun run db:generate
        env:
          DATABASE_URL: file:./ci.db
      - name: Typecheck
        working-directory: frontend
        run: bun check --no-script
      - name: Unit tests
        working-directory: frontend
        run: bun run test
      - name: Build
        working-directory: frontend
        run: bun run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Eden types in mobile/src/lib/api.ts import the backend app type.
      - name: Generate Prisma Client
        working-directory: backend
        run: bun run db:generate
        env:
          DATABASE_URL: file:./ci.db
      - name: Typecheck
        working-directory: mobile
        run: bun check --no-script
      - name: Unit tests
        working-directory: mobile
        run: bun run test

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: desktop
        run: bun check --no-script
      - name: Build standalone server (embedded in the app)
        run: bun run build:standalone
      - name: Package (unpacked, Linux)
        working-directory: desktop
        run: bun run build && bunx electron-builder --dir
      # The smoke test proves the packaged app boots its embedded server and
      # renders the app. CI runners cannot use Chromium's SUID
      # sandbox helper, hence --no-sandbox.
      - name: Smoke test the packaged app
        working-directory: desktop
        run: xvfb-run -a ./release/linux-unpacked/agent-money --smoke --no-sandbox

  # Shared hexagonal core (packages/core). Keep this job light — no Prisma.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun check --no-script -p packages/core
      - name: Unit tests
        run: bun test packages/core

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: bunx playwright test
        env:
          CI: true

  # Human-like QA + pentest pass over API, web, desktop and bot (scripts/qa.ts).
  # The Android group needs an emulator and skips itself here.
  qa:
    runs-on: ubuntu-latest
    needs: [backend, frontend, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Generate Prisma Client
        working-directory: backend
        run: bun run db:generate
        env:
          DATABASE_URL: file:./ci.db
      - name: QA / pentest
        run: xvfb-run -a bun scripts/qa.ts --start --headless --only api,web,desktop,bot --report qa-report.md --shots qa-shots
        env:
          CI: true
          ELECTRON_DISABLE_SANDBOX: 1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: qa-report
          path: |
            qa-report.md
            qa-shots/
