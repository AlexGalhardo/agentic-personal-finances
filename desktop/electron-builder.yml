# `bun run dist` packages the current OS only (electron-builder cannot build
# macOS off a Mac); the release workflow runs it on each runner.
appId: com.elysiagalhardofinances.money.desktop
productName: Agent Money
executableName: agent-money
directories:
  output: release
  # The repo .gitignore ignores `build/`, electron-builder's default.
  buildResources: assets
files:
  - dist/**
  - assets/icon.png
  - package.json
# Embedded server: `bun run build:standalone` (repo root) must run first. The
# binary and its `.standalone/` sidecar ship under resources/standalone/.
extraResources:
  - from: ../.standalone
    to: standalone/.standalone
win:
  target: nsis
  extraResources:
    - from: ../agentic-personal-finances.exe
      to: standalone/agentic-personal-finances.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Finance
  extraResources:
    - from: ../agentic-personal-finances
      to: standalone/agentic-personal-finances
mac:
  # Unsigned: the workflow ad hoc signs the .app (Apple Silicon refuses
  # unsigned code) and zips it. A dmg/notarization needs a Developer ID.
  target: dir
  category: public.app-category.finance
  identity: null
  extraResources:
    - from: ../agentic-personal-finances
      to: standalone/agentic-personal-finances
