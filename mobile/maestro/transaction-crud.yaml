appId: com.elysiagalhardofinances.money
---
# The app is offline-first (local SQLite), so there is no login: it opens
# straight on the dashboard. Runs the full create -> find -> edit -> delete
# cycle for one transaction.
- launchApp:
    clearState: true
- assertVisible: "Your money"

# Create — the center "+" in the bottom bar opens /transaction/new.
- tapOn:
    id: "nav-new-transaction"
- assertVisible:
    id: "field-Amount"
- tapOn: "Expense"
- tapOn:
    id: "field-Amount"
- inputText: "4321"
- tapOn:
    id: "field-Description"
- inputText: "Maestro E2E Purchase"
- hideKeyboard
- tapOn: "Shopping"
- tapOn: "Add"
- assertVisible: "Your money"

# Find it through search.
- tapOn:
    id: "nav-search"
- tapOn:
    id: "search-input"
- inputText: "Maestro E2E Purchase"
- assertVisible: "Maestro E2E Purchase"

# Edit — tapping the row opens /transaction/[id] pre-filled.
- tapOn:
    text: "Maestro E2E Purchase"
    below:
      id: "search-input"
- tapOn:
    id: "field-Amount"
- eraseText
- inputText: "9999"
- hideKeyboard
- tapOn: "Save changes"
- assertVisible: '.*R\$ 99.99'

# Delete — the form's own button, then the native confirmation.
- tapOn:
    text: "Maestro E2E Purchase"
    below:
      id: "search-input"
- scrollUntilVisible:
    element:
      text: "Delete transaction"
- tapOn: "Delete transaction"
- tapOn:
    text: "^Delete$"
- assertVisible: "No results"
